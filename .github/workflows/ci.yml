name: CI Pipeline Spring Boot

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: mvn -B clean verify

      - name: Verificar disponibilidad del secreto de demostración
        env:
          APP_ENV: ${{ secrets.APP_ENV_DEMO }}
        run: |
          if [ -n "$APP_ENV" ]; then
            echo "El secreto APP_ENV_DEMO está configurado; su valor no se imprime."
          else
            echo "APP_ENV_DEMO aún no está configurado; el resto del pipeline continúa."
          fi

      - name: Publicar reporte JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-jacoco
          path: target/site/jacoco
          if-no-files-found: warn
